<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parity — three-clouds-webgpu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111;
        color: #ccc;
        font-family: monospace;
      }
      #harness {
        display: flex;
        width: 100vw;
        height: calc(100vh - 32px);
      }
      .side {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .side canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .side-label {
        position: absolute;
        top: 4px;
        left: 8px;
        font-size: 12px;
        color: #0f0;
        pointer-events: none;
        z-index: 10;
      }
      #footer {
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: #1a1a1a;
        border-top: 1px solid #333;
        font-size: 11px;
      }
      #footer .case-name {
        color: #8cf;
      }
      #footer .gates {
        color: #aaa;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #888;
      }
      #view-toolbar {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 8px;
        border-radius: 4px;
      }
      #view-toolbar button {
        background: #333;
        color: #ccc;
        border: 1px solid #555;
        padding: 2px 10px;
        font: 11px monospace;
        cursor: pointer;
        border-radius: 2px;
      }
      #view-toolbar button.active {
        background: #4a9eff;
        color: #fff;
        border-color: #4a9eff;
      }
      #panel-container {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="harness">
      <div class="side" id="side-a">
        <div class="side-label">A · WebGL</div>
        <canvas id="canvas-a"></canvas>
      </div>
      <div class="side" id="side-b">
        <div class="side-label">B · WebGPU</div>
        <canvas id="canvas-b"></canvas>
      </div>
    </div>
    <div id="footer">
      <span class="case-name" id="case-name">No case loaded</span>
      <span class="gates" id="gates"></span>
    </div>
    <div id="status"></div>
    <div id="view-toolbar" style="display: none">
      <button data-view="ab" class="active">A|B</button>
      <button data-view="wipe">Wipe</button>
      <button data-view="onion">Onion</button>
      <button data-view="diff">Diff</button>
    </div>
    <div id="panel-container"></div>
    <div id="grid-container" style="display: none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
