<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>three-clouds-webgpu — 3D Tiles example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status-overlay {
        position: absolute;
        bottom: 16px;
        left: 16px;
        background: rgba(10, 15, 25, 0.85);
        color: #e0e6ed;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        padding: 12px 16px;
        max-width: 480px;
        font-size: 13px;
        line-height: 1.5;
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      #status-overlay code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="status-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
